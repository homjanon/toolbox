# 老张工具箱 · Android 云构建（本机无 JDK/SDK，全部在 GitHub Actions 完成）
# 推到 main 或打 tag 触发；产物挂 GitHub Releases（release）+ Actions Artifacts（debug）
name: android-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu runner 自带 Android SDK（ANDROID_HOME 已配置），无需额外安装
      - name: 安装依赖
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 同步 web 资源到 android
        run: npx cap sync android

      - name: 构建类型
        id: bt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ inputs.build_type }}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 APK（debug）
        if: steps.bt.outputs.type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 构建 APK（release，需 keystore Secrets）
        if: steps.bt.outputs.type == 'release'
        env:
          KEYSTORE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "未配置签名 Secrets（APK_KEYSTORE_B64 等），本次退回 debug 构建"
            cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          else
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            printf 'storeFile=../app/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
            # 注：assembleRelease 产出未签名 APK，直到 android/app/build.gradle 接入 keystore.properties
            cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          fi

      - name: 上传 debug 构建产物
        if: steps.bt.outputs.type == 'debug'
        uses: actions/upload-artifact@v7
        with:
          name: toolbox-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: 发布 Release（tag 推送时）
        if: startsWith(github.ref, 'refs/tags/v') && steps.bt.outputs.type == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
