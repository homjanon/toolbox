<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>老张工具箱</title>
<style>
  /* ── 新首页设计 v2：只放两个核心功能，留白充足、状态栏安全 ── */
  :root{
    --bg:#f4f6f9; --card:#fff; --ink:#12161c; --ink2:#5d6875; --ink3:#94a0ae;
    --line:#e8ecf1; --blue:#2563eb; --teal:#0d9488;
    --shadow:0 1px 2px rgba(18,22,28,.04), 0 8px 24px -12px rgba(18,22,28,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink); margin:0;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    padding:0 0 env(safe-area-inset-bottom);
  }
  /* 顶部安全区：原生侧保证 WebView 已在状态栏之下，这里再留一段呼吸空间 */
  .top-pad{height:8px}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px 32px}

  /* ── 标题区 ── */
  .head{padding:10px 2px 22px}
  .head .hello{font-size:13.5px;color:var(--ink3);letter-spacing:.01em}
  .head h1{font-size:28px;line-height:1.2;margin:5px 0 0;letter-spacing:-.6px;font-weight:700}
  .head .date{font-size:13px;color:var(--ink2);margin-top:7px}

  /* ── 功能卡 ── */
  .cards{display:flex;flex-direction:column;gap:14px}
  .feat{
    display:block;position:relative;border-radius:22px;overflow:hidden;
    text-decoration:none;color:inherit;box-shadow:var(--shadow);
    transition:transform .12s ease;
  }
  .feat:active{transform:scale(.982)}

  /* 卡1：新闻（渐变深色，视觉主角） */
  .feat.news{
    background:linear-gradient(135deg,#0f766e 0%,#0d9488 42%,#1d4ed8 130%);
    color:#fff;padding:22px 20px 20px;
  }
  .feat.news::after{ /* 右上角装饰光斑 */
    content:"";position:absolute;right:-46px;top:-56px;width:170px;height:170px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.28),rgba(255,255,255,0) 68%);
  }
  .row{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
  .ico{
    width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:23px;background:rgba(255,255,255,.16);
  }
  .feat.news .ico{background:rgba(255,255,255,.2)}
  .ttl{font-size:17.5px;font-weight:700;letter-spacing:-.2px}
  .sub{font-size:12.8px;margin-top:3px;opacity:.82}
  .chev{margin-left:auto;flex:none;font-size:19px;opacity:.72;transform:translateY(-1px)}

  /* 新闻卡的状态条：两枚场次胶囊 */
  .sessions{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1}
  .pill{
    flex:1;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.18);
    border-radius:13px;padding:9px 11px;backdrop-filter:blur(2px)
  }
  .pill.done{background:rgba(255,255,255,.22)}
  .pill .n{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
  .pill .t{font-size:11.5px;opacity:.8;margin-top:3px}
  .dot{width:6px;height:6px;border-radius:50%;background:#86efac;flex:none}
  .dot.wait{background:rgba(255,255,255,.45)}

  /* 卡2：资产（白卡） */
  .feat.inv{background:var(--card);padding:20px}
  .feat.inv .ico{background:#eef4ff;color:var(--blue)}
  .feat.inv .sub{color:var(--ink3);opacity:1}
  .feat.inv .chev{color:var(--ink3);opacity:1}
  .tags{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:600;color:var(--blue);background:#eef4ff;border-radius:8px;padding:3px 9px}

  /* ── 底部 ── */
  .tip{display:none;margin:0 2px 14px;padding:11px 13px;border-radius:12px;font-size:12.5px;
    line-height:1.6;background:#fffbeb;border:1px solid #fde68a;color:#92400e;
    position:relative;z-index:1}
  .foot{margin-top:26px;text-align:center;color:var(--ink3);font-size:11.5px;line-height:1.9}
  .more{
    margin-top:18px;display:block;text-align:center;color:var(--ink2);font-size:13px;
    text-decoration:none;padding:12px;border-radius:14px;background:#fff;box-shadow:var(--shadow);
  }
</style>
</head>
<body>
  <div class="top-pad"></div>
  <div class="wrap">

    <div class="head">
      <div class="hello" id="hello">早上好，老张</div>
      <h1>工具箱</h1>
      <div class="date" id="today">—</div>
    </div>

    <div class="tip" id="nativeTip"></div>

    <div class="cards">

      <!-- ① 早咖啡 / 下午茶 -->
      <a class="feat news" id="cardNews" href="#" data-url="https://homjanon.github.io/news-feed/">
        <div class="row">
          <div class="ico">☕</div>
          <div>
            <div class="ttl">早咖啡 · 下午茶</div>
            <div class="sub" id="newsSub">谷歌 + 联合早报 · 各 10 条 AI 摘要</div>
          </div>
          <div class="chev">›</div>
        </div>
        <div class="sessions">
          <div class="pill" id="pillAm">
            <div class="n"><span class="dot wait"></span>早咖啡</div>
            <div class="t" id="amTime">待更新</div>
          </div>
          <div class="pill" id="pillPm">
            <div class="n"><span class="dot wait"></span>下午茶</div>
            <div class="t" id="pmTime">15:20</div>
          </div>
        </div>
      </a>

      <!-- ② 个人资产管理 -->
      <a class="feat inv" id="cardInv" href="#" data-url="https://inv.hellohopo.dpdns.org/">
        <div class="row">
          <div class="ico">💼</div>
          <div>
            <div class="ttl">个人资产管理</div>
            <div class="sub">持仓 · 盈亏 · 云端同步</div>
          </div>
          <div class="chev">›</div>
        </div>
        <div class="tags">
          <span class="tag">A股</span><span class="tag">港股</span>
          <span class="tag">美股</span><span class="tag">场外基金</span>
        </div>
      </a>

    </div>

    <div class="foot">
      老张工具箱 · 一期<br>仅供研究参考，不构成投资建议
    </div>
  </div>

<script>
/* 日期与问候 */
(function () {
  var d = new Date(Date.now() + 8 * 3600e3);      /* 北京时区 */
  var H = d.getUTCHours();
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getUTCDay()];
  document.getElementById('today').textContent =
    d.toISOString().slice(0,10).replace(/-/g,' / ') + ' ' + w;
  document.getElementById('hello').textContent =
    H < 6 ? '夜深了，老张' : H < 11 ? '早上好，老张' : H < 14 ? '中午好，老张'
          : H < 18 ? '下午好，老张' : '晚上好，老张';
})();

/* 打开模块 → 原生容器页 ModuleActivity（自带「‹返回 / ⌂首页」顶栏）。
   ⚠️ 两轮排查结论（2026-09-13）：
     ① Capacitor 7 的 Capacitor.Plugins 是普通对象，插件要前端注册才挂上去；
     ② 但**真正注入 WebView 的是 @capacitor/android 的 native-bridge.js，里面没有 registerPlugin**
        （只有 core 的构建产物才有）→ 无打包器场景下唯一可用的是底层通道：
        window.Capacitor.nativePromise(pluginName, methodName, options)  ← 已读桥源码确认签名。
   因此这里走三条独立通道，逐级兜底，全部失败才提示： */
(function () {
  var cap = window.Capacitor || {};
  var inApp = typeof cap.isNativePlatform === 'function' && cap.isNativePlatform();

  function tip(msg) {
    var el = document.getElementById('nativeTip');
    if (!el) return;
    el.style.display = 'block';
    el.textContent = msg;
  }

  /** 通道①：Capacitor 底层桥（注入桥里确定存在） */
  function viaBridge(url, name) {
    if (typeof cap.nativePromise !== 'function') return false;
    try {
      cap.nativePromise('ModuleLauncher', 'open', { url: url, name: name });
      return true;
    } catch (e) { return false; }
  }
  /** 通道②：原生 JS 接口（MainActivity 注入的 AndroidToolbox，与 Capacitor 完全独立） */
  function viaInterface(url, name) {
    var n = window.AndroidToolbox;
    if (!n || typeof n.openModule !== 'function') return false;
    try { n.openModule(url, name); return true; } catch (e) { return false; }
  }
  /** 通道③：已被前端注册过的插件代理（打包器场景才会存在，留着无害） */
  function viaPlugins(url, name) {
    try {
      var P = cap.Plugins && cap.Plugins.ModuleLauncher;
      if (P && typeof P.open === 'function') { P.open({ url: url, name: name }); return true; }
    } catch (e) { }
    return false;
  }

  function openModule(url, name) {
    if (viaBridge(url, name)) return true;
    if (viaInterface(url, name)) return true;
    if (viaPlugins(url, name)) return true;
    if (inApp) tip('⚠️ 三条原生通道都不可用，已用内置浏览器打开（可能没有返回/首页按钮）。请把这条提示反馈给开发者。');
    return false;
  }

  function bind(id, nameGetter) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', function (ev) {
      ev.preventDefault();
      if (openModule(el.getAttribute('data-url'), nameGetter())) return;
      window.location.href = el.getAttribute('data-url');   // 网页预览 / 最终兜底
    });
  }
  bind('cardNews', function () { return '早咖啡 · 下午茶'; });
  bind('cardInv', function () { return '个人资产管理'; });

  if (inApp && !cap.nativePromise && !window.AndroidToolbox) {
    tip('⚠️ 未检测到原生通道（nativePromise / AndroidToolbox 均不可用），模块将以网页方式打开。');
  }
})();

/* 新闻卡实时状态：homjanon.github.io 带 CORS *，App 内可直连 */
(function () {
  function getJSON(u, ms) {
    return new Promise(function (res, rej) {
      var c = new AbortController(), t = setTimeout(function () { c.abort(); rej(new Error('timeout')); }, ms || 6000);
      fetch(u + (u.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now(), { signal: c.signal })
        .then(function (r) { clearTimeout(t); if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(res, rej);
    });
  }
  var base = 'https://homjanon.github.io/news-feed/';
  var d = new Date(Date.now() + 8 * 3600e3);
  var today = d.toISOString().slice(0, 10);
  function paint(el, pillEl, timeEl, j) {
    if (!j) return;
    var t = (j.fetched_at || '').slice(11, 16);
    timeEl.textContent = t ? (t + ' · ' + (j.counts ? j.counts.total : '?') + ' 条') : '已更新';
    var dot = pillEl.querySelector('.dot');
    if (dot) { dot.className = 'dot'; }
    pillEl.classList.add('done');
  }
  /* 两场分别取当天文件；哪个存在点亮哪个 */
  getJSON(base + 'news/' + today + '-morning.json').then(function (j) {
    paint(null, document.getElementById('pillAm'), document.getElementById('amTime'), j);
  }).catch(function () {});
  getJSON(base + 'news/' + today + '-afternoon.json').then(function (j) {
    paint(null, document.getElementById('pillPm'), document.getElementById('pmTime'), j);
  }).catch(function () {});
  /* 摘要/副标题随最新一场更新 */
  getJSON(base + 'latest.json').then(function (j) {
    var t = (j.fetched_at || '').slice(11, 16);
    document.getElementById('newsSub').textContent =
      (j.editionName || '新闻') + '已更新 · ' + t + ' · ' + (j.counts ? j.counts.total : 20) + ' 条';
  }).catch(function () {});
})();
</script>
</body>
</html>
