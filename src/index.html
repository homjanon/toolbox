<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>老张工具箱</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="top-pad"></div>
  <div class="wrap">

    <div class="head">
      <div class="hello" id="hello">早上好，老张</div>
      <h1>工具箱</h1>
      <div class="date" id="today">—</div>
    </div>

    <div class="tip" id="nativeTip"></div>

    <div class="cards">

      <!-- ① 早咖啡 / 下午茶 -->
      <a class="feat news" id="cardNews" href="#" data-url="https://homjanon.github.io/news-feed/">
        <div class="row">
          <div class="ico">☕</div>
          <div>
            <div class="ttl">早咖啡 · 下午茶</div>
            <div class="sub" id="newsSub">谷歌 + 联合早报 · 各 10 条 AI 摘要</div>
          </div>
          <div class="chev">›</div>
        </div>
        <div class="sessions">
          <div class="pill" id="pillAm">
            <div class="n"><span class="dot wait"></span>早咖啡</div>
            <div class="t" id="amTime">待更新</div>
          </div>
          <div class="pill" id="pillPm">
            <div class="n"><span class="dot wait"></span>下午茶</div>
            <div class="t" id="pmTime">15:20</div>
          </div>
        </div>
      </a>

      <!-- ② 个人资产管理 -->
      <a class="feat inv" id="cardInv" href="#" data-url="https://inv.hellohopo.dpdns.org/">
        <div class="row">
          <div class="ico">💼</div>
          <div>
            <div class="ttl">个人资产管理</div>
            <div class="sub">持仓 · 盈亏 · 云端同步</div>
          </div>
          <div class="chev">›</div>
        </div>
        <div class="tags">
          <span class="tag">A股</span><span class="tag">港股</span>
          <span class="tag">美股</span><span class="tag">场外基金</span>
        </div>
      </a>

    </div>

    <div class="foot">
      老张工具箱 · 一期<br>仅供研究参考，不构成投资建议
    </div>
  </div>

<script type="module" src="./main.js"></script>
</body>
</html>
